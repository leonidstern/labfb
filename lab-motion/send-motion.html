<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send motion options</title>
<style>
:root{--ink:#111;--mut:#8a8a8e;--green:rgb(52,199,89);--line:#e5e5ea}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:24px 16px 64px}
main{max-width:380px;margin:0 auto}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 8px}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:40px 0 2px}
.intro{color:var(--mut);font-size:14px;margin:0 0 18px}
.opt{margin:0 0 28px}
.cap{display:flex;gap:8px;align-items:baseline;margin:0 0 8px}
.n{font-weight:700;flex:none}
.rec{flex:none;position:relative;top:-1px;font-size:11px;font-weight:600;color:#fff;background:var(--green);border-radius:6px;padding:1px 6px}
.ms{color:var(--mut);font-size:13px;white-space:nowrap}

.stage{position:relative;height:290px;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:#fff;cursor:pointer;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black)}
.pg{position:absolute;left:22px;right:22px;top:22px;display:flex;flex-direction:column;gap:10px}
.pg b,.pg i{display:block;height:9px;border-radius:5px;background:#ececf0}
.pg b{height:14px;background:#dedee3;margin-bottom:6px}
.play{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.05);color:var(--mut);
  display:grid;place-items:center;font-size:11px;padding-left:2px;pointer-events:none;z-index:4}

/* pin */
.pinw{position:absolute;left:44%;top:86px;width:28px;height:28px;transform-origin:0 100%;z-index:1}
.sc .pinw{top:104px}
.pin{position:absolute;inset:0;background:#fff;border:1px solid rgba(0,0,0,.15);border-radius:14px 14px 14px 2px;
  box-shadow:0 2px 6px rgba(0,0,0,.14);display:grid;place-items:center}
.let{font-size:12px;font-weight:600;line-height:1}
.rw{position:absolute;left:-10px;top:-10px;width:48px;height:48px;opacity:0;pointer-events:none}
.rw svg{display:block;width:48px;height:48px;transform:rotate(-90deg)}
.rw circle{fill:none;stroke:var(--green);stroke-width:2.5;stroke-linecap:round}
.arc{stroke-dasharray:92 140}
.full{stroke-dasharray:140 140;stroke-dashoffset:140}
.halo{position:absolute;inset:-1px;border-radius:14px 14px 14px 2px;border:2px solid rgba(0,0,0,.18);opacity:0;pointer-events:none}
.halo.g{border-color:var(--green)}
.dot{position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:#111;border:1.5px solid #fff;transform:scale(0)}
.read{position:absolute;left:4px;top:33px;font-size:10px;font-weight:500;color:var(--mut);opacity:0;white-space:nowrap}
.st{position:absolute;left:0;right:0;bottom:20px;text-align:center;font-size:13px;color:var(--mut)}

/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:20px 14px 22px;z-index:2;
  box-shadow:0 -1px 0 rgba(0,0,0,.04),0 -8px 28px rgba(0,0,0,.12)}
.grab{position:absolute;top:7px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:#d1d1d6}
.box{display:flex;align-items:center;gap:8px;border:1px solid #d1d1d6;border-radius:22px;padding:3px 3px 3px 15px;min-height:44px}
.tx{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden}
.tx.ph{color:#c7c7cc}
.send{position:relative;flex:none;width:36px;height:36px;border-radius:50%;background:#111;border:0;padding:0;display:grid;place-items:center;
  overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.send.off{background:#c7c7cc}
.send>i{grid-area:1/1;font-style:normal}
.arr{position:relative;width:2px;height:14px;background:#fff;border-radius:1px;margin-top:2px}
.arr::before{content:"";position:absolute;left:-3px;top:1px;width:8px;height:8px;border-left:2px solid #fff;border-top:2px solid #fff;transform:rotate(45deg)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;opacity:0}
.ok{color:#fff;font-size:17px;font-weight:600;opacity:0}
.bub{position:absolute;left:0;top:0;background:#e9e9eb;border-radius:18px;padding:7px 12px;font-size:15px;white-space:nowrap;pointer-events:none;z-index:3}
</style>
</head>
<body>
<main>
  <h1>Send and after-send motion</h1>
  <p class="sub">Tap a stage to play it. Pin what you like by number.</p>
  <div id="list"></div>
</main>
<script>
(() => {
const R = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LIN = !!(window.CSS && CSS.supports && CSS.supports('animation-timing-function', 'linear(0, 1)'));

// damped spring sampled into a linear() easing; z = damping ratio (lower = bouncier)
function spring(z) {
  const w = 6.4 / z, wd = w * Math.sqrt(1 - z * z), p = [];
  for (let i = 0; i <= 40; i++) {
    const t = i / 40;
    p.push(+(1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t))).toFixed(4));
  }
  p[40] = 1;
  return 'linear(' + p.join(',') + ')';
}
const BOUNCE = LIN ? spring(.5) : 'cubic-bezier(.34,1.56,.64,1)';
const SOFT = LIN ? spring(.75) : 'cubic-bezier(.3,1.3,.5,1)';
const IOS = 'cubic-bezier(.32,.72,0,1)';

function A(el, kf, o) {
  o = typeof o === 'number' ? { duration: o } : Object.assign({}, o);
  o.fill = 'both';
  o.easing = o.easing || 'ease';
  if (R) { o.duration = 0; o.delay = 0; o.iterations = 1; }
  return el.animate(kf, o);
}
function pos(stage, el) {
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: r.left - s.left - stage.clientLeft, y: r.top - s.top - stage.clientTop, w: r.width, h: r.height };
}

/* ---------- stage markup ---------- */
const LINES = '<div class="pg"><b style="width:58%"></b><i style="width:94%"></i><i style="width:88%"></i><i style="width:72%"></i>' +
  '<i style="width:90%"></i><i style="width:64%"></i><i style="width:84%"></i><i style="width:50%"></i></div>';
const PIN = hidden => '<div class="pinw"' + (hidden ? ' style="opacity:0"' : '') + '>' +
  '<div class="rw"><svg viewBox="0 0 48 48"><circle class="arc" cx="24" cy="24" r="21"/><circle class="full" cx="24" cy="24" r="21"/></svg></div>' +
  '<span class="halo"></span><div class="pin"><span class="let">L</span></div><span class="dot"></span><span class="read">Read</span></div>';
const SHEET = (empty, text) => '<div class="sheet"><div class="grab"></div><div class="box">' +
  '<div class="tx' + (empty ? ' ph' : '') + '">' + (empty ? 'Add a comment…' : (text || 'Make the title bigger')) + '</div>' +
  '<button class="send' + (empty ? ' off' : '') + '" aria-label="Send"><i class="arr"></i><i class="spin"></i><i class="ok">✓</i></button></div></div>';

function build(stage, d) {
  stage.classList.toggle('sc', d.sec === 'C');
  stage.innerHTML = LINES + PIN(d.sec !== 'A') +
    (d.sec === 'C' ? '<div class="st">tap to play</div>' : SHEET(d.empty, d.text)) +
    '<span class="play">▶︎</span>';
}

/* ---------- shared moves ---------- */
const closeSheet = (q, delay = 0, dur = 300, easing = IOS) =>
  A(q('.sheet'), [{ transform: 'translateY(0)' }, { transform: 'translateY(115%)' }], { duration: dur, delay, easing });

function sink(q, to = .9, down = 90, back = 420, ease = BOUNCE) {
  const b = q('.send');
  return A(b, [{ transform: 'scale(1)' }, { transform: 'scale(' + to + ')' }], { duration: down, easing: 'ease-out' })
    .finished.then(() => A(b, [{ transform: 'scale(' + to + ')' }, { transform: 'scale(1)' }], { duration: back, easing: ease }));
}
const press = q => sink(q, .92, 80, 360, SOFT);

function pinPop(q, from = .7, ease = BOUNCE, dur = 460) {
  return A(q('.pinw'), [{ opacity: 0, transform: 'scale(' + from + ')' }, { opacity: 1, transform: 'scale(1)' }], { duration: dur, easing: ease });
}
function greenFlash(q, delay = 0) {
  const h = q('.halo');
  h.classList.add('g');
  A(h, [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(1.9)' }], { duration: 650, easing: 'ease-out', delay });
  A(q('.pin'), [{ borderColor: 'rgba(0,0,0,.15)' }, { borderColor: 'rgb(52,199,89)', offset: .25 }, { borderColor: 'rgba(0,0,0,.15)' }], { duration: 700, delay });
}
async function sheetIntoPin(q, w, st) {
  const sh = q('.sheet'), p = pos(st, q('.pinw')), s = pos(st, sh);
  const dx = p.x + 14 - (s.x + s.w / 2), dy = p.y + 14 - (s.y + s.h / 2);
  A(sh, [{ transform: 'translate(0,0) scale(1,1)', opacity: 1 }, { opacity: 1, offset: .65 },
    { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + (28 / s.w) + ',' + (28 / s.h) + ')', opacity: 0 }],
    { duration: 360, easing: IOS });
  await w(250);
  pinPop(q);
}

/* Claude status sequence: placed -> (read) -> working -> done */
async function status(q, w, o) {
  const st = q('.st'), pw = q('.pinw'), rw = q('.rw'), svg = q('.rw svg'), let_ = q('.let'), pin = q('.pin');
  st.textContent = 'placed';
  pinPop(q, .6, BOUNCE, 380);
  await w(800);
  if (o.read) {
    st.textContent = 'read by Claude';
    A(q('.read'), [{ opacity: 0, transform: 'translateY(3px)' }, { opacity: 1, transform: 'translateY(0)' }], 220);
    await w(800);
  }
  st.textContent = 'Claude working';
  const spin = A(svg, [{ transform: 'rotate(-90deg)' }, { transform: 'rotate(270deg)' }], { duration: 1100, iterations: Infinity, easing: 'linear' });
  if (o.ring === 'draw') {
    A(rw, [{ opacity: 1 }, { opacity: 1 }], 1);
    A(q('.arc'), [{ strokeDashoffset: 92 }, { strokeDashoffset: 0 }], { duration: 400, easing: 'ease-out' });
  } else {
    A(rw, [{ opacity: 0 }, { opacity: 1 }], 300);
  }
  if (o.read) A(q('.read'), [{ opacity: 1 }, { opacity: 0 }], { duration: 250, delay: 500 });
  await w(1900);
  st.textContent = 'done, new reply';

  if (o.done === 'close') {
    spin.pause();
    await A(q('.full'), [{ strokeDashoffset: 48 }, { strokeDashoffset: 0 }], { duration: 220, easing: 'ease-out' }).finished;
    A(rw, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.45)', opacity: 0 }], { duration: 300, easing: 'cubic-bezier(.5,0,.75,0)' });
    A(let_, [{ opacity: 1 }, { opacity: 0 }], 90);
    await w(170);
    let_.textContent = '✓';
    A(let_, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 320, easing: BOUNCE });
  } else if (o.done === 'flip') {
    A(rw, [{ opacity: 1 }, { opacity: 0 }], 200);
    await A(pin, [{ transform: 'perspective(120px) rotateY(0deg)' }, { transform: 'perspective(120px) rotateY(90deg)' }], { duration: 160, easing: 'ease-in' }).finished;
    let_.textContent = '✓';
    A(pin, [{ transform: 'perspective(120px) rotateY(-90deg)' }, { transform: 'perspective(120px) rotateY(0deg)' }], { duration: 260, easing: SOFT });
  } else {
    A(rw, [{ opacity: 1 }, { opacity: 0 }], 200);
    await A(let_, [{ opacity: 1 }, { opacity: 0 }], 80).finished;
    let_.textContent = '✓';
    A(let_, [{ opacity: 0, transform: 'scale(.72)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 360, easing: SOFT });
  }
  await w(220);
  A(q('.dot'), [{ transform: 'scale(0)' }, { transform: 'scale(1)' }], { duration: 320, easing: BOUNCE });
}

/* ---------- options ---------- */
const D = [
  { sec: 'A', id: 'A1', cap: 'Now: arrow flies out up-right and comes back while the sheet closes', ms: '320 ms',
    run: async (q) => {
      A(q('.arr'), [{ transform: 'translate(0,0)', opacity: 1 }, { transform: 'translate(16px,-16px)', opacity: 0, offset: .45 },
        { transform: 'translate(-10px,10px)', opacity: 0, offset: .5 }, { transform: 'translate(0,0)', opacity: 1 }],
        { duration: 320, easing: 'ease-in-out' });
      closeSheet(q);
    } },
  { sec: 'A', id: 'A2', rec: 1, cap: 'Press sinks to 90% and springs back, no fly (like iMessage)', ms: '90 + 420 ms',
    run: async (q) => { sink(q); closeSheet(q, 160); } },
  { sec: 'A', id: 'A3', cap: 'Arrow turns into a small spinner while sending, then ✓, then the sheet closes', ms: '≈ 1.3 s',
    run: async (q, w) => {
      const sp = q('.spin');
      A(q('.arr'), [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.4)' }], { duration: 140, easing: 'ease-in' });
      A(sp, [{ opacity: 0 }, { opacity: 1 }], { duration: 140, delay: 100 });
      A(sp, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 700, iterations: Infinity, easing: 'linear' });
      await w(900);
      A(sp, [{ opacity: 1 }, { opacity: 0 }], 120);
      A(q('.ok'), [{ opacity: 0, transform: 'scale(.5)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 320, delay: 80, easing: BOUNCE });
      await w(450);
      closeSheet(q);
    } },
  { sec: 'A', id: 'A4', cap: 'Arrow slides straight up and out, then fades back in place', ms: '160 + 220 ms',
    run: async (q) => {
      const ar = q('.arr');
      closeSheet(q, 100);
      await A(ar, [{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(-22px)', opacity: 0 }], { duration: 160, easing: 'ease-in' }).finished;
      A(ar, [{ transform: 'scale(.6)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 220, delay: 40, easing: 'ease-out' });
    } },
  { sec: 'A', id: 'A5', rec: 1, empty: 1, cap: 'Button goes grey → black with a tiny pop when you start typing (pairs with any)', ms: '160 ms',
    run: async (q, w) => {
      const tx = q('.tx'), b = q('.send'), s = 'Make the title bigger';
      for (let i = 1; i <= s.length; i++) {
        if (i === 1) {
          tx.classList.remove('ph');
          A(b, [{ background: '#c7c7cc', transform: 'scale(1)' }, { background: '#111', transform: 'scale(1.08)', offset: .5 },
            { background: '#111', transform: 'scale(1)' }], { duration: 160, easing: 'ease-out' });
        }
        tx.textContent = s.slice(0, i);
        await w(55);
      }
      await w(500);
      sink(q);
      closeSheet(q, 160);
    } },
  { sec: 'A', id: 'A6', text: 'Press the black button →', cap: 'Live: press the button yourself. It sinks while your finger is down, springs back when you lift', ms: '110 + 420 ms',
    run: async (q, w, st, again) => {
      const b = q('.send');
      let down = false;
      b.addEventListener('click', e => e.stopPropagation());
      b.addEventListener('pointerdown', e => {
        e.stopPropagation();
        down = true;
        A(b, [{ transform: 'scale(1)' }, { transform: 'scale(.88)' }], { duration: 110, easing: 'ease-out' });
      });
      const up = () => {
        if (!down) return;
        down = false;
        A(b, [{ transform: 'scale(.88)' }, { transform: 'scale(1)' }], { duration: 420, easing: BOUNCE });
        closeSheet(q, 80);
        w(1600).then(again).catch(() => {});
      };
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => b.addEventListener(t, up));
    } },

  { sec: 'B', id: 'B1', cap: 'Now: sheet shrinks toward where you tapped and fades; pin lands 1.1 → 1 with one faint halo', ms: '200 ms',
    run: async (q, w, st) => {
      press(q); await w(90);
      const sh = q('.sheet'), pw = q('.pinw'), p = pos(st, pw), s = pos(st, sh);
      sh.style.transformOrigin = (p.x - s.x) + 'px ' + (p.y + 28 - s.y) + 'px';
      A(sh, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.15)', opacity: 0 }], { duration: 200, easing: 'ease-in' });
      await w(160);
      A(pw, [{ opacity: 1, transform: 'scale(1.1)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 200, easing: 'ease-out' });
      A(q('.halo'), [{ opacity: .9, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(1.8)' }], { duration: 520, easing: 'ease-out' });
    } },
  { sec: 'B', id: 'B2', rec: 1, cap: 'Sheet shrinks into the new pin; the pin gives one small bounce when it arrives', ms: '360 + 460 ms',
    run: async (q, w, st) => { press(q); await w(90); await sheetIntoPin(q, w, st); } },
  { sec: 'B', id: 'B3', cap: 'Your text flies as a bubble from the box to the pin while the sheet slides down', ms: '420 ms',
    run: async (q, w, st) => {
      press(q); await w(90);
      const tx = q('.tx'), t = pos(st, tx), p = pos(st, q('.pinw'));
      const bub = document.createElement('div');
      bub.className = 'bub';
      bub.textContent = tx.textContent;
      st.appendChild(bub);
      const bx = t.x - 12, by = t.y + t.h / 2 - bub.offsetHeight / 2;
      bub.style.left = bx + 'px'; bub.style.top = by + 'px';
      const dx = p.x + 14 - (bx + bub.offsetWidth / 2), dy = p.y + 14 - (by + bub.offsetHeight / 2);
      tx.style.opacity = 0;
      closeSheet(q);
      A(bub, [{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { opacity: 1, offset: .75 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.12)', opacity: 0 }], { duration: 420, easing: 'cubic-bezier(.4,0,.2,1)' });
      await w(340);
      pinPop(q);
    } },
  { sec: 'B', id: 'B4', cap: 'Sheet slides straight down; pin drops from 12 px above with a small bounce, like a map pin', ms: '280 + 440 ms',
    run: async (q, w) => {
      press(q); await w(90);
      closeSheet(q, 0, 280);
      await w(100);
      A(q('.pinw'), [{ opacity: 0, transform: 'translateY(-12px)', easing: 'ease-in' },
        { opacity: 1, transform: 'translateY(0)', offset: .45, easing: 'ease-out' },
        { transform: 'translateY(-3px)', offset: .7, easing: 'ease-in' },
        { opacity: 1, transform: 'translateY(0)' }], { duration: 440, easing: 'linear' });
    } },
  { sec: 'B', id: 'B5', cap: 'Sheet slides down; pin flashes a green ring once ("sent"), then settles', ms: '650 ms',
    run: async (q, w) => {
      press(q); await w(90);
      closeSheet(q, 0, 280);
      await w(120);
      A(q('.pinw'), [{ opacity: 0, transform: 'scale(.9)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 180, easing: 'ease-out' });
      greenFlash(q, 80);
    } },
  { sec: 'B', id: 'B6', cap: 'B2 + B5: sheet shrinks into the pin, then one green "sent" ring', ms: '360 + 650 ms',
    run: async (q, w, st) => { press(q); await w(90); await sheetIntoPin(q, w, st); greenFlash(q, 120); } },
  { sec: 'B', id: 'B7', cap: 'Sheet flicks down fast, like a swipe-away; pin grows in softly from 60%', ms: '220 + 380 ms',
    run: async (q, w) => {
      press(q); await w(90);
      closeSheet(q, 0, 220, 'cubic-bezier(.2,.9,.3,1)');
      await w(90);
      pinPop(q, .6, SOFT, 380);
    } },

  { sec: 'C', id: 'C1', cap: 'Now: ring fades in and turns; on done the L grows into ✓ and the ring fades', ms: '300 / 360 ms',
    run: (q, w) => status(q, w, { ring: 'fade', done: 'grow' }) },
  { sec: 'C', id: 'C2', rec: 1, cap: 'Ring draws itself in (0 → ¾ turn), then turns', ms: '400 ms draw',
    run: (q, w) => status(q, w, { ring: 'draw', done: 'grow' }) },
  { sec: 'C', id: 'C3', rec: 1, cap: 'On done the ring closes into a full green circle, then shrinks into the ✓', ms: '220 + 300 ms',
    run: (q, w) => status(q, w, { ring: 'fade', done: 'close' }) },
  { sec: 'C', id: 'C4', cap: 'On done the pin flips like a coin from L to ✓', ms: '160 + 260 ms',
    run: (q, w) => status(q, w, { ring: 'fade', done: 'flip' }) },
  { sec: 'C', id: 'C5', cap: 'A small "Read" shows under the pin before the ring starts, like iMessage', ms: '220 ms',
    run: (q, w) => status(q, w, { read: 1, ring: 'fade', done: 'grow' }) },
  { sec: 'C', id: 'C6', rec: 1, cap: 'C2 + C3 together: ring draws in, turns, then closes into the ✓', ms: '400 / 220 + 300 ms',
    run: (q, w) => status(q, w, { ring: 'draw', done: 'close' }) }
];

const SECTIONS = {
  A: ['A · Send button', 'The sheet just slides down here, so you only judge the button.'],
  B: ['B · After send', 'The pin is hidden while you type here, so you see how it arrives.'],
  C: ['C · Claude on the pin', 'Each plays: placed → Claude working → done. Tap to play again.']
};

/* ---------- render + play ---------- */
const byId = {};
async function play(stage) {
  const d = byId[stage.dataset.id], id = (stage._id || 0) + 1;
  stage._id = id;
  build(stage, d);
  const q = s => stage.querySelector(s);
  const w = ms => new Promise(r => setTimeout(r, R ? 0 : ms)).then(() => { if (stage._id !== id) throw 0; });
  try {
    await w(350);
    await d.run(q, w, stage, () => play(stage));
  } catch (e) { /* replaced by a newer play */ }
}

const list = document.getElementById('list');
let html = '', sec = '';
D.forEach(d => {
  byId[d.id] = d;
  if (d.sec !== sec) {
    sec = d.sec;
    html += '<h2>' + SECTIONS[sec][0] + '</h2><p class="intro">' + SECTIONS[sec][1] + '</p>';
  }
  html += '<section class="opt" id="' + d.id + '"><div class="cap"><span class="n">' + d.id + '</span>' +
    (d.rec ? '<span class="rec">rec</span>' : '') + '<span>' + d.cap + ' <span class="ms">· ' + d.ms + '</span></span></div>' +
    '<div class="stage" data-id="' + d.id + '" role="button" aria-label="Play ' + d.id + '"></div></section>';
});
list.innerHTML = html;

const stages = [...document.querySelectorAll('.stage')];
stages.forEach(s => {
  build(s, byId[s.dataset.id]);
  s.addEventListener('click', () => play(s));
});

// play each stage once the first time it scrolls into view
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { io.unobserve(e.target); play(e.target); }
  }), { threshold: .6 });
  stages.forEach(s => io.observe(s));
}
})();
</script>
</body>
</html>
