<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home page: the picture</title>
<link rel="stylesheet" href="/_lab/lab.css">
<style>
  .crop { margin: 0; padding: 12px; background: var(--lab-bg); border-radius: 12px; display: inline-block; }

<body class="lab">
<main>

<section id="crops">

  <svg viewBox="300 150 280 210" role="img" aria-label="The sailboat"><image href="media/harbour-800.jpg" width="800" height="533"/></svg>
  <figcaption>The sailboat</figcaption>
</figure>
</section>
</main>
