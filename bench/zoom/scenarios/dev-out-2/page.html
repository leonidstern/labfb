<title>How a page gets its comments</title>

<body class="lab">
<main>
<h1 id="title" data-from="t2">How a page gets its comments</h1>
<section id="store" data-from="t3 t2">
  <h2>On disk</h2>
  <p>One file per page in <code>.lab/comments/</code>. A new comment rewrites only its page's file. Each page's list is kept, compressed, until that page changes.</p>
</section>
<section id="first-paint" data-from="t6 t4 t2">
  <h2>On the page</h2>
  <p>The page loads first. The widget then asks the lab for the page's comments and draws the pins.</p>
</section>
</main>
