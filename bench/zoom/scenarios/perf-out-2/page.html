<h1 id="title" data-from="t2">How a page load is served</h1>
<section id="cache" data-from="t7 t5 t3">
  <h2>Kept lists</h2>
  <p>Each page's comments list is kept, compressed, until that page changes. Kept lists use up to 10 MB in all; when that is full, the oldest goes first.</p>
</section>
<section id="limit" data-from="t9">
  <h2>New comments</h2>
  <p>A local lab takes up to 600 new comments an hour from one device.</p>
</section>
