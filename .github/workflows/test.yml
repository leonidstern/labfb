name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check local.mjs && node --check src/comments.js && node --check public/_lab/comments.js && node --check lib/comments-api.mjs
      - run: npm test

  # Dead code: files nothing imports, and exports nothing outside their own file uses. Knip runs from npx,
  # pinned, so labit keeps zero dependencies; knip.json lists the entry points.
  dead-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run deadcode

  # Reuse: one drawer, one dimmed page, shared gestures, keyboard fit, animations and styles (ci/reuse.mjs). Something
  # new is listed in ci/parts.json on purpose, in the same pull request.
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run reuse

  # The widget in real browsers: Safari's engine (WebKit) and Chrome's. Playwright is installed
  # only here (--no-save), so labit itself keeps zero dependencies.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1.65.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node test/browser/behaviours.mjs
      # The live connection: one stream per tab, let go in the background, back in front, replaced when quiet, bye on leaving.
      - run: node test/browser/connection.mjs
      # Shortcuts from labit.json: the new keys work, the old ones don't, the bar shows them.
      - run: node test/browser/shortcuts.mjs
      # Pins finding their spot again: reordered twins, their own box first, quoted words, made-up ids and classes.
      - run: node test/browser/anchoring.mjs
      # Selected words: the chip, the dialog it grows into, slash actions, Escape, reload, saved files, right to left, reduced motion.
      - run: node test/browser/fluid.mjs
      # What a drag does: words (the chip, no Shift), empty space (an area), a click (a point), a double-click, fields and links.
      - run: node test/browser/selection.mjs
      # New since you looked: the pill and list of the ids the agent added, what drops one off, two names, a phone's sheet, and what must never count.
      - run: node test/browser/changes.mjs
      # Agent readability: pins on a photo, a code line and a video second must be findable from the link alone.
      - run: node bench/run.mjs
