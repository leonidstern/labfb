name: test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Node 22 (the oldest labit supports) on every PR; 24 and 26 only on main, where they rarely differ.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ${{ fromJSON(github.event_name == 'pull_request' && '[22]' || '[22, 24, 26]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check local.mjs && node --check src/comments.js && node --check public/_lab/comments.js && node --check lib/comments-api.mjs
      - run: npm test

  # Two quick checks in one job:
  # - Dead code: files nothing imports, and exports nothing outside their own file uses. Knip runs from npx,
  #   pinned, so labit keeps zero dependencies; knip.json lists the entry points.
  # - Reuse: one drawer, one dimmed page, shared gestures, keyboard fit, animations and styles (ci/reuse.mjs).
  #   Something new is listed in ci/parts.json on purpose, in the same pull request.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run reuse
      - run: npm run deadcode

  # The widget in real browsers: Safari's engine (WebKit) and Chrome's. Playwright is installed
  # only here (--no-save), so labit itself keeps zero dependencies. Split by engine and by file
  # group so the jobs run side by side: the slowest (fluid.mjs) gets a job of its own.
  # They run on Leo's Mac (four self-hosted runners labelled labit-mac, one job each; Leo, 20 Nov: "most heavy ones
  # [on my Mac] and gh only harnesses"). Only for main and for PRs from this repository: a fork's code never runs
  # on the Mac, so a fork's PR shows "browser" failed until someone pushes it to a branch here.
  browser:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, labit-mac]
    timeout-minutes: 12 # a hung browser fails here instead of holding the PR for half an hour
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
        group:
          # Selected words: the chip, the dialog it grows into, slash actions, Escape, reload, saved files, right to left, reduced motion.
          - fluid
          # behaviours; the live connection; shortcuts from labit.json; pins finding their spot again;
          # what a drag does (words, an area, a point, fields and links); new since you looked (the pill and list of the
          # ids the agent added, what drops one off, two names, a phone's sheet, and what must never count).
          # Ink on selected words (flag inkOnText).
          # A phone pinch-zoomed in: the bar and the chat stay their usual size on screen (zoom).
          # The "!" on the labit mark for a held reload: its host, its label, a tap that takes the update (updbadge).
          - behaviours connection shortcuts anchoring selection flags progress moved zoom shiftkeys frame framescroll boardreload board boardmode boardpins boardarrange boardview boardhalf boardclose select sections actions draw motionreach ink updbadge update undo moment nativepins native nativeboard
    name: browser (${{ matrix.engine }}, ${{ matrix.group == 'fluid' && 'fluid' || 'rest' }})
    # The Mac keeps Playwright's browsers in ~/Library/Caches/ms-playwright (chromium 1255, webkit 2388 for 1.65.1),
    # so nothing is downloaded per run.
    env:
      ENGINES: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1.65.1
      - name: Run ${{ matrix.group }}
        run: for t in ${{ matrix.group }}; do echo "::group::$t"; node test/browser/$t.mjs; echo "::endgroup::"; done
      # Agent readability: pins on a photo, a code line and a video second must be findable from the link alone.
      - if: matrix.engine == 'chromium' && matrix.group != 'fluid'
        run: node bench/run.mjs

  # One required check name for branch protection, green only when every browser job is.
  browser-all:
    if: always()
    needs: browser
    runs-on: ubuntu-latest
    name: browser
    steps:
      - run: test "${{ needs.browser.result }}" = success
