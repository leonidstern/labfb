name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check local.mjs && node --check src/comments.js && node --check public/_lab/comments.js && node --check api/lab-comments.mjs
      - run: npm test

  # The widget in real browsers: Safari's engine (WebKit) and Chrome's. Playwright is installed
  # only here (--no-save), so labit itself keeps zero dependencies.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1.65.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node test/browser/behaviours.mjs
      # Agent readability: pins on a photo, a code line and a video second must be findable from the link alone.
      - run: node bench/run.mjs
